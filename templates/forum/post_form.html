{% extends "base.html" %}
{% block title %}發表文章｜批踢踢 Redesign{% endblock %}
{% block content %}
<div class="form-page card">
  <h1>發表文章</h1>
  <p class="muted small">提示：在內文貼上圖片網址（.jpg / .png）或 YouTube 連結，文章會自動顯示圖片與影片預覽。</p>
  <form method="post" class="stack-form">{% csrf_token %}
    {% for field in form %}
      <label class="field"><span>{{ field.label }}</span>{{ field }}
        {% if field.errors %}<em class="error small">{{ field.errors|striptags }}</em>{% endif %}
      </label>
    {% endfor %}
    <div class="form-actions">
      <a href="javascript:history.back()" class="btn btn-ghost">取消</a>
      <button class="btn btn-primary">送出文章</button>
    </div>
  </form>
</div>
{% endblock %}
